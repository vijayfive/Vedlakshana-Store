<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vedlakshana Store</title>
<meta name="theme-color" content="#633532">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vedlakshana Store">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#FFF1E5; --surface-3:#FFE3CC;
    --ink:#26201D; --ink-muted:#6B5D52; --ink-faint:#9A8A76;
    --accent:#633532; --accent-ink:#FFFFFF; --accent-soft:#FFEBD6;
    --accent2:#FE730C; --accent2-ink:#2A1204;
    --success:#3F8F5F; --success-soft:#E4F1E8;
    --warning:#B4720F; --warning-soft:#FBEDD8;
    --danger:#B4382C; --danger-soft:#F8E4E1;
    --border:#F0D9C2; --shadow:0 1px 2px rgba(42,33,31,.07),0 4px 12px rgba(42,33,31,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1614; --surface:#241C19; --surface-2:#2E2420; --surface-3:#392C26;
      --ink:#F3E9DE; --ink-muted:#B8A492; --ink-faint:#82705F;
      --accent:#E0956F; --accent-ink:#241310; --accent-soft:#3D2C1E;
      --accent2:#FE8A3C; --accent2-ink:#2A1204;
      --success:#5FBE84; --success-soft:#1E3327;
      --warning:#E3A24C; --warning-soft:#3A2C15;
      --danger:#E2685A; --danger-soft:#3A211E;
      --border:#3E332C; --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1614; --surface:#241C19; --surface-2:#2E2420; --surface-3:#392C26;
    --ink:#F3E9DE; --ink-muted:#B8A492; --ink-faint:#82705F;
    --accent:#E0956F; --accent-ink:#241310; --accent-soft:#3D2C1E;
    --accent2:#FE8A3C; --accent2-ink:#2A1204;
    --success:#5FBE84; --success-soft:#1E3327;
    --warning:#E3A24C; --warning-soft:#3A2C15;
    --danger:#E2685A; --danger-soft:#3A211E;
    --border:#3E332C; --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans",system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  #app{min-height:100vh; display:flex; flex-direction:column; max-width:560px; margin:0 auto; background:var(--bg);}
  h1,h2,h3{font-family:"Sora",system-ui,sans-serif; margin:0; text-wrap:balance; letter-spacing:-.01em;}
  .num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit; cursor:pointer;}
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms!important; transition-duration:.001ms!important;} }

  .lock-screen{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:32px 24px; text-align:center;}
  .lock-mark{width:72px; height:72px; border-radius:20px; background:var(--accent2); overflow:hidden; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);}
  .lock-mark img{width:100%; height:100%; object-fit:cover;}
  .lock-title{font-family:"Sora",system-ui,sans-serif; font-size:24px; font-weight:700; color:var(--accent); letter-spacing:-.01em;}
  .lock-sub{color:var(--ink-muted); font-size:14px; margin-top:4px;}
  .pin-dots{display:flex; gap:14px; margin:6px 0;}
  .pin-dot{width:14px; height:14px; border-radius:50%; border:2px solid var(--ink-faint); background:transparent; transition:background .12s,border-color .12s;}
  .pin-dot.filled{background:var(--accent); border-color:var(--accent);}
  .pin-dot.err{border-color:var(--danger); background:var(--danger);}
  .pad{display:grid; grid-template-columns:repeat(3,64px); gap:14px;}
  .pad button{width:64px; height:64px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:20px; font-weight:500; display:flex; align-items:center; justify-content:center;}
  .pad button:active{background:var(--surface-2);}
  .pad button.ghost{border-color:transparent; background:transparent; color:var(--ink-muted); font-size:14px;}
  .lock-error{color:var(--danger); font-size:13px; min-height:18px;}

  .topbar{display:flex; align-items:baseline; justify-content:space-between; padding:18px 20px 12px; position:sticky; top:0; background:var(--bg); z-index:5;}
  .topbar .store-name{font-family:"Sora",system-ui,sans-serif; font-size:20px; font-weight:700; color:var(--accent); letter-spacing:-.01em;}
  .topbar .date{font-size:12px; color:var(--ink-muted); font-family:"IBM Plex Mono",monospace;}
  .screen{flex:1; overflow-y:auto; padding:0 16px 96px;}
  .navbar{position:sticky; bottom:0; display:flex; background:var(--surface); border-top:1px solid var(--border); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); gap:2px; z-index:10;}
  .nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 0 6px; border:none; background:none; border-radius:12px; color:var(--ink-faint); font-size:10.5px; font-weight:500;}
  .nav-btn .ic{font-size:18px;}
  .nav-btn.active{color:var(--accent); background:var(--accent-soft);}

  .section-label{font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); margin:20px 2px 10px;}
  .search{width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:14px; margin-top:12px;}
  .search::placeholder{color:var(--ink-faint);}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow);}
  .empty{padding:36px 16px; text-align:center; color:var(--ink-muted); font-size:14px;}

  .product-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
  .product-tile{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; text-align:left; display:flex; flex-direction:column; gap:6px; min-height:84px; position:relative;}
  .product-tile:active{background:var(--surface-2);}
  .product-tile .pname{font-size:13.5px; font-weight:500; line-height:1.25;}
  .product-tile .pprice{font-size:14px; color:var(--accent); font-weight:600;}
  .product-tile .pstock{font-size:11px; color:var(--ink-faint);}
  .product-tile .pstock.low{color:var(--warning);}
  .product-tile .pstock.out{color:var(--danger);}
  .product-tile.disabled{opacity:.45; pointer-events:none;}
  .qty-badge{position:absolute; top:8px; right:8px; background:var(--accent2); color:var(--accent2-ink); font-size:11px; font-weight:700; min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0 5px;}

  .cart-bar{position:sticky; bottom:64px; margin:12px -16px 0; padding:12px 16px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:space-between; border-radius:14px 14px 0 0; box-shadow:0 -4px 14px rgba(0,0,0,.12);}
  .cart-bar .ct-info{font-size:13px; opacity:.92;}
  .cart-bar .ct-total{font-size:17px; font-weight:700;}
  .cart-bar button{background:var(--accent2); color:#FFFFFF; border:none; padding:9px 16px; border-radius:10px; font-weight:700; font-size:13px; text-shadow:0 1px 1px rgba(0,0,0,.18);}

  .sheet-backdrop{position:fixed; inset:0; background:rgba(20,18,14,.45); z-index:40; display:flex; align-items:flex-end; justify-content:center;}
  .sheet{width:100%; max-width:560px; background:var(--surface); border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); max-height:86vh; overflow-y:auto;}
  .sheet-handle{width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 14px;}
  .sheet h3{font-size:17px; margin-bottom:4px;}
  .cart-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .cart-row:last-of-type{border-bottom:none;}
  .cart-row .cn{flex:1; font-size:14px;}
  .cart-row .cp{font-size:12px; color:var(--ink-muted);}
  .stepper{display:flex; align-items:center; gap:8px;}
  .stepper button{width:28px; height:28px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:15px; line-height:1;}
  .stepper .qv{min-width:20px; text-align:center; font-size:13px;}
  .cart-line-total{width:64px; text-align:right; font-size:13.5px; font-weight:600;}
  .sheet-total-row{display:flex; justify-content:space-between; align-items:baseline; padding:14px 0 4px; font-size:15px; font-weight:600;}
  .sheet-total-row .num{font-size:19px;}
  .btn-primary{width:100%; background:var(--accent2); color:#FFFFFF; border:none; padding:14px; border-radius:12px; font-size:15px; font-weight:700; margin-top:10px; text-shadow:0 1px 1px rgba(0,0,0,.18);}
  .btn-primary:disabled{opacity:.5;}
  .btn-secondary{width:100%; background:var(--surface-2); color:var(--ink); border:1px solid var(--border); padding:12px; border-radius:12px; font-size:14px; font-weight:500; margin-top:8px;}
  .btn-danger-text{width:100%; background:var(--danger-soft); border:1px solid var(--danger); color:var(--danger); font-size:13.5px; font-weight:600; padding:11px; border-radius:12px; margin-top:8px;}
  .btn-danger-text:active{background:var(--danger); color:#FFFFFF;}

  .inv-row{display:flex; align-items:center; gap:10px; padding:13px 4px; border-bottom:1px solid var(--border);}
  .inv-row:last-child{border-bottom:none;}
  .inv-row .iname{font-size:14px; font-weight:500;}
  .inv-row .iprice{font-size:11.5px; color:var(--ink-muted); margin-top:1px;}
  .stock-pill{font-size:12px; font-weight:600; padding:4px 9px; border-radius:999px; white-space:nowrap;}
  .stock-pill.ok{background:var(--success-soft); color:var(--success);}
  .stock-pill.low{background:var(--warning-soft); color:var(--warning);}
  .stock-pill.out{background:var(--danger-soft); color:var(--danger);}
  .restock-btn{background:var(--accent-soft); color:var(--accent); border:none; font-size:11px; font-weight:700; padding:6px 9px; border-radius:8px; white-space:nowrap;}
  .fab{position:fixed; right:calc(50% - 280px + 18px); bottom:80px; width:52px; height:52px; border-radius:50%; background:var(--accent2); color:var(--accent2-ink); border:none; font-size:24px; box-shadow:var(--shadow); z-index:8;}
  @media (max-width:559px){ .fab{right:18px;} }
  .field{margin-top:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-muted); margin-bottom:6px;}
  .field input, .field select{width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:15px;}

  .stat-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
  .stat-row3{grid-template-columns:repeat(3,1fr);}
  .stat-row3 .sv{font-size:17px;}
  .stat-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px;}
  .stat-card .sv{font-size:22px; font-weight:700; font-family:"IBM Plex Mono",monospace;}
  .stat-card .sl{font-size:11.5px; color:var(--ink-muted); margin-top:2px;}
  .bar-chart{display:flex; align-items:flex-end; gap:8px; height:110px; margin-top:14px; padding:0 2px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%;}
  .bar{width:100%; max-width:30px; background:var(--accent); border-radius:5px 5px 2px 2px; min-height:3px;}
  .bar-col .bl{font-size:10px; color:var(--ink-faint);}
  .sale-row{padding:12px 4px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; gap:10px;}
  .sale-row:last-child{border-bottom:none;}
  .sale-row .st{font-size:11px; color:var(--ink-muted); font-family:"IBM Plex Mono",monospace;}
  .sale-row .sd{font-size:13px; margin-top:2px;}
  .sale-row .sv{font-weight:600; font-size:14px; white-space:nowrap;}

  .subtabs{display:flex; gap:6px; margin-top:12px; overflow-x:auto; padding-bottom:2px;}
  .subtab-btn{flex:0 0 auto; padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink-muted); font-size:12.5px; font-weight:600; white-space:nowrap;}
  .subtab-btn.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}

  .segmented{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .seg-btn{flex:1; min-width:70px; padding:10px 6px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink-muted); font-size:12.5px; font-weight:600; text-align:center;}
  .seg-btn.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  .receipt-item{display:flex; justify-content:space-between; padding:7px 0; font-size:13px; border-bottom:1px dashed var(--border);}
  .receipt-item:last-child{border-bottom:none;}
  .small-note{font-size:11.5px; color:var(--ink-faint); margin-top:6px;}

  .settings-row{display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border-bottom:1px solid var(--border);}
  .settings-row:last-child{border-bottom:none;}
  .settings-row .sl2{font-size:14px;}
  .settings-row .sd2{font-size:12px; color:var(--ink-muted); margin-top:2px;}
  .link-btn{background:none; border:none; color:var(--accent); font-size:13.5px; font-weight:600;}
  .toast{position:fixed; left:50%; bottom:88px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:13px; z-index:60; box-shadow:var(--shadow); max-width:90%; text-align:center;}
  .sync-dot{width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle;}
  .sync-dot.ok{background:var(--success);}
  .sync-dot.bad{background:var(--danger);}
  .sync-dot.busy{background:var(--warning);}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* =========================================================================
   CONFIGURE THESE TWO VALUES after you deploy Code.gs as a Google Apps
   Script Web App (see SETUP.md). Everything else works as-is.
   ========================================================================= */
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyGNEoKRKWrkyeegdAfJfXNbqxJ5Juq_ibuoQ2MYnHl3rK-bdl5_0Wwxdw595y9ONL4/exec';
var WRITE_TOKEN = 'siddhnathmahadevkijay';
/* ========================================================================= */

(function(){

  var PAYMENT_METHODS = ['Cash','UPI','Card','Other'];
  var EXPENSE_CATEGORIES = ['Rent','Electricity','Salary','Transport','Misc','Other'];

  var DEFAULT_STATE = {
    storeName: 'Vedlakshana Store',
    pin: '1234',
    lowStockThreshold: 5,
    products: [],
    sales: [],
    purchases: [],
    expenses: []
  };

  var state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  var configured = SCRIPT_URL.indexOf('PASTE_YOUR') === -1;
  var syncStatus = configured ? 'busy' : 'bad'; // 'ok' | 'busy' | 'bad'
  var unlocked = false;
  var pinBuffer = '';
  var pinError = false;
  var tab = 'home';
  var cart = {};
  var search = '';
  var sheetOpen = false;
  var editingProduct = null;
  var restockProduct = null;
  var addingExpense = null;
  var lastSale = null;
  var reportsSub = 'sales';
  var reportsRange = '7d';
  var customFrom = null;
  var customTo = null;
  var cartCustomerName = '';
  var cartCustomerPhone = '';
  var cartPayment = 'Cash';
  var toastMsg = '';
  var toastAction = null;
  var toastTimer = null;
  var saving = false;
  var stateLoaded = !configured;
  var bioPlatformAvailable = false;
  var bioBusy = false;
  var bioAutoTried = false;

  /* ---------- fingerprint / face unlock (WebAuthn, device-local) ---------- */
  var BIO_KEY = 'vlk_bio_cred_id';
  function bioCredId(){ try{ return localStorage.getItem(BIO_KEY); }catch(e){ return null; } }
  function bufToB64(buf){ var bytes = new Uint8Array(buf), s=''; for(var i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]); return btoa(s); }
  function b64ToBuf(b64){ var bin = atob(b64), bytes = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return bytes.buffer; }
  if(window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable){
    PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function(v){ bioPlatformAvailable = !!v; render(); }).catch(function(){});
  }
  function setupFingerprint(){
    if(!bioPlatformAvailable){ alert('Fingerprint / face unlock isn\'t available on this device or browser.'); return; }
    navigator.credentials.create({
      publicKey:{
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp:{ name: state.storeName || 'Vedlakshana Store' },
        user:{ id: crypto.getRandomValues(new Uint8Array(16)), name:'owner', displayName: state.storeName || 'Vedlakshana Store' },
        pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
        authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required' },
        timeout:60000,
        attestation:'none'
      }
    }).then(function(cred){
      try{ localStorage.setItem(BIO_KEY, bufToB64(cred.rawId)); }catch(e){}
      showToast('Fingerprint unlock set up on this device');
      render();
    }).catch(function(err){
      alert('Could not set up fingerprint unlock: ' + (err && err.message ? err.message : 'cancelled'));
    });
  }
  function removeFingerprint(){
    try{ localStorage.removeItem(BIO_KEY); }catch(e){}
    showToast('Fingerprint unlock removed from this device');
    render();
  }
  function tryBioUnlock(){
    var credId = bioCredId();
    if(!credId || bioBusy) return;
    bioBusy = true; render();
    navigator.credentials.get({
      publicKey:{
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials:[{ id: b64ToBuf(credId), type:'public-key' }],
        userVerification:'required',
        timeout:60000
      }
    }).then(function(){
      bioBusy=false; unlocked=true; pinBuffer=''; pinError=false; render();
    }).catch(function(){
      bioBusy=false; render();
    });
  }

  function todayKey(ts){ var d = new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  var REPORT_RANGES = [['1d','Today'],['7d','7 Days'],['30d','1 Month'],['90d','Quarter'],['custom','Custom']];
  function rangeDays(r){ return r==='1d'?1 : r==='30d'?30 : r==='90d'?90 : 7; }
  function customBounds(){
    var to = customTo ? new Date(customTo+'T23:59:59') : new Date();
    var from = customFrom ? new Date(customFrom+'T00:00:00') : (function(){ var d=new Date(to); d.setDate(d.getDate()-6); d.setHours(0,0,0,0); return d; })();
    return { from: from.getTime(), to: to.getTime() };
  }
  function rangeLabel(r){
    if(r==='custom'){
      if(!customFrom && !customTo) return 'Custom range';
      var b = customBounds();
      return new Date(b.from).toLocaleDateString('en-IN',{day:'numeric',month:'short'}) + ' – ' + new Date(b.to).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
    }
    var f=REPORT_RANGES.find(function(x){return x[0]===r;}); return f?f[1]:'7 Days';
  }
  function rangeStart(r){ var d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-(rangeDays(r)-1)); return d.getTime(); }
  function inRange(ts, r){
    if(r==='custom'){ var b=customBounds(); return ts>=b.from && ts<=b.to; }
    return ts >= rangeStart(r);
  }
  function money(n){ return '₹' + Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}); }
  // jsPDF's built-in fonts (Helvetica) have no ₹ glyph — it prints as a stray "1" or box.
  // Use a plain "Rs." prefix for anything written into the PDF instead.
  function moneyPdf(n){ return 'Rs. ' + Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  /* ---------- backend sync ---------- */
  function loadState(){
    if(!configured){ render(); return; }
    syncStatus = 'busy'; render();
    fetch(SCRIPT_URL, {method:'GET'})
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data && data.products){
          data.purchases = data.purchases || [];
          data.expenses = data.expenses || [];
          state = data;
        }
        syncStatus = 'ok';
        stateLoaded = true;
        render();
      })
      .catch(function(){ syncStatus = 'bad'; stateLoaded = true; render(); });
  }

  function persist(){
    render();
    if(!configured) return;
    saving = true;
    syncStatus = 'busy'; render();
    fetch(SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids a CORS preflight against Apps Script
      body: JSON.stringify({token:WRITE_TOKEN, state:state})
    })
      .then(function(r){ return r.json(); })
      .then(function(res){
        saving = false;
        syncStatus = (res && res.ok) ? 'ok' : 'bad';
        render();
      })
      .catch(function(){ saving = false; syncStatus = 'bad'; render(); });
  }

  function showToast(msg, action){
    toastMsg = msg; toastAction = action || null; render();
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastMsg=''; toastAction=null; render(); }, action ? 4500 : 2200);
  }

  /* ---------- mutations: products ---------- */
  function addProduct(p){
    state.products.push({id:uid(), name:p.name, price:Number(p.price)||0, costPrice:Number(p.costPrice)||0, stock:Number(p.stock)||0});
    persist();
  }
  function updateProduct(id,p){
    var i = state.products.findIndex(function(x){return x.id===id;});
    if(i>-1) state.products[i] = Object.assign({}, state.products[i], {name:p.name, price:Number(p.price)||0, costPrice:Number(p.costPrice)||0, stock:Number(p.stock)||0});
    persist();
  }
  function deleteProduct(id){
    state.products = state.products.filter(function(x){return x.id!==id;});
    delete cart[id];
    persist();
  }

  /* ---------- mutations: stock inward (purchases) ---------- */
  function recordPurchase(productId, qty, costPrice, newPrice){
    var p = state.products.find(function(x){return x.id===productId;});
    if(!p || qty<=0) return;
    p.stock = (Number(p.stock)||0) + qty;
    p.costPrice = costPrice;
    if(newPrice!==undefined && !isNaN(newPrice) && newPrice>0) p.price = newPrice;
    state.purchases.push({id:uid(), ts:Date.now(), productId:p.id, productName:p.name, qty:qty, costPrice:costPrice, total: qty*costPrice});
    persist();
    showToast('Stock added — ' + p.name);
  }

  /* ---------- mutations: sale ---------- */
  function completeSale(){
    var items = Object.keys(cart).map(function(pid){
      var p = state.products.find(function(x){return x.id===pid;});
      return p ? {productId:pid, name:p.name, price:p.price, costPrice:p.costPrice||0, qty:cart[pid]} : null;
    }).filter(Boolean);
    if(!items.length) return;
    var total = items.reduce(function(sum,it){ return sum + it.price*it.qty; },0);
    items.forEach(function(it){
      var p = state.products.find(function(x){return x.id===it.productId;});
      if(p) p.stock = Math.max(0, p.stock - it.qty);
    });
    var sale = {
      id: uid(), ts: Date.now(), items: items, total: total,
      paymentMethod: cartPayment || 'Cash',
      customerName: (cartCustomerName||'').trim(),
      customerPhone: (cartCustomerPhone||'').trim()
    };
    state.sales.push(sale);
    cart = {};
    sheetOpen = false;
    cartCustomerName = ''; cartCustomerPhone = ''; cartPayment = 'Cash';
    lastSale = sale;
    persist();
    showToast('Sale completed — ' + money(sale.total), {label:'Share bill', fn:function(){ sharePdfBill(sale); }});
  }

  /* ---------- mutations: expenses ---------- */
  function addExpense(e){
    state.expenses.push({id:uid(), ts:Date.now(), description:(e.description||'').trim(), amount:Number(e.amount)||0, category:e.category||'Misc'});
    persist();
  }

  /* ---------- PDF bill sharing ---------- */
  function sharePdfBill(sale){
    if(!(window.jspdf && window.jspdf.jsPDF)){ showToast('PDF library did not load — check your connection'); return; }
    var doc = new window.jspdf.jsPDF({unit:'mm', format:'a5'});
    var y = 15;
    doc.setFontSize(14); doc.text(state.storeName || 'Store', 10, y); y += 7;
    doc.setFontSize(9); doc.text(new Date(sale.ts).toLocaleString('en-IN'), 10, y); y += 6;
    if(sale.customerName || sale.customerPhone){
      doc.text('Customer: ' + [sale.customerName, sale.customerPhone].filter(Boolean).join(' - '), 10, y); y += 6;
    }
    y += 3;
    doc.setFontSize(10);
    sale.items.forEach(function(it){
      doc.text(it.name + '  x' + it.qty, 10, y);
      doc.text(moneyPdf(it.price*it.qty), 132, y, {align:'right'});
      y += 6;
    });
    y += 2;
    doc.line(10, y, 135, y); y += 7;
    doc.setFontSize(12);
    doc.text('Total', 10, y);
    doc.text(moneyPdf(sale.total), 132, y, {align:'right'});
    y += 8;
    doc.setFontSize(9);
    doc.text('Paid via ' + sale.paymentMethod, 10, y);

    var blob = doc.output('blob');
    var fileName = 'bill-' + sale.id + '.pdf';
    try{
      var file = new File([blob], fileName, {type:'application/pdf'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title: state.storeName || 'Bill', text: 'Bill from ' + (state.storeName || 'the store')}).catch(function(){});
        return;
      }
    }catch(e){}
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    showToast('PDF downloaded — attach it in WhatsApp manually');
  }

  function onPinKey(k){
    pinError = false;
    if(k==='⌫'){ pinBuffer = pinBuffer.slice(0,-1); render(); return; }
    if(pinBuffer.length>=4) return;
    pinBuffer += k;
    render();
    if(pinBuffer.length===4){
      setTimeout(function(){
        if(pinBuffer === (state.pin||'1234')){ unlocked = true; pinBuffer=''; render(); }
        else { pinError = true; render(); setTimeout(function(){ pinBuffer=''; pinError=false; render(); }, 550); }
      }, 120);

    w.appendChild(s);

      tile.appendChild(el('div','pname', p.name));
      tile.appendChild(el('div','pprice', money(p.price)));
      var lowT = state.lowStockThreshold || 5;
      var stockCls = p.stock<=0 ? 'out' : (p.stock<=lowT ? 'low' : '');

    var cancel = el('button','btn-secondary','Cancel');
    cancel.onclick = function(){ editingProduct=null; render(); };
    sheet.appendChild(cancel);
    bd.appendChild(sheet);
    return bd;
  }
  function renderRestockSheet(){
    var p = restockProduct;
    var bd = el('div','sheet-backdrop');
    bd.onclick = function(e){ if(e.target===bd){ restockProduct=null; render(); } };
    var sheet = el('div','sheet');
    sheet.appendChild(el('div','sheet-handle'));
    sheet.appendChild(el('h3','','Stock inward — ' + p.name));
    sheet.appendChild(el('div','small-note','Record new stock received for this product.'));
    var qtyF = el('div','field'); qtyF.appendChild(el('label','','Quantity received'));
    var qtyI = el('input',''); qtyI.type='number'; qtyI.inputMode='numeric'; qtyI.placeholder='0'; qtyI.value=p.qty;
    qtyI.oninput=function(e){p.qty=e.target.value;}; qtyF.appendChild(qtyI); sheet.appendChild(qtyF);
    var costF = el('div','field'); costF.appendChild(el('label','','Purchase price (₹ per unit)'));
    var costI = el('input',''); costI.type='number'; costI.inputMode='decimal'; costI.placeholder='0'; costI.value=p.costPrice;
    costI.oninput=function(e){p.costPrice=e.target.value;}; costF.appendChild(costI); sheet.appendChild(costF);
    var priceF = el('div','field'); priceF.appendChild(el('label','','Sale price (₹ per unit)'));
    var priceI = el('input',''); priceI.type='number'; priceI.inputMode='decimal'; priceI.placeholder='0'; priceI.value=p.price;
    priceI.oninput=function(e){p.price=e.target.value;}; priceF.appendChild(priceI); sheet.appendChild(priceF);
    var save = el('button','btn-primary','Add stock');
    save.onclick = function(){
      var qty = Number(p.qty)||0;
      if(qty<=0) return;
      recordPurchase(p.id, qty, Number(p.costPrice)||0, Number(p.price));
      restockProduct = null; render();
    };
    sheet.appendChild(save);
    var cancel = el('button','btn-secondary','Cancel');
    cancel.onclick = function(){ restockProduct=null; render(); };
    sheet.appendChild(cancel);
    bd.appendChild(sheet);
    return bd;
  }

  /* ---- expenses ---- */
  function renderExpenses(){
    var w = document.createElement('div');
    var today = todayKey(Date.now());
    var todayExp = state.expenses.filter(function(x){return todayKey(x.ts)===today;});
    var total = todayExp.reduce(function(s,x){return s+x.amount;},0);
    var stats = el('div','stat-row');
    var c1=el('div','stat-card'); c1.appendChild(el('div','sv num',money(total))); c1.appendChild(el('div','sl',"Today's expenses"));
    var c2=el('div','stat-card'); c2.appendChild(el('div','sv num',String(todayExp.length))); c2.appendChild(el('div','sl','Entries today'));
    stats.appendChild(c1); stats.appendChild(c2); w.appendChild(stats);
    w.appendChild(el('div','section-label','Today'));
    if(!todayExp.length){ w.appendChild(el('div','empty','No expenses logged today.')); }
    else{
      var card=el('div','card'); card.style.padding='2px 12px';
      todayExp.slice().reverse().forEach(function(x){
        var row=el('div','sale-row');
        var l=document.createElement('div');
        l.appendChild(el('div','st', new Date(x.ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})));
        l.appendChild(el('div','sd', x.description + (x.category?' · '+x.category:'')));
        row.appendChild(l);
        row.appendChild(el('div','sv num', money(x.amount)));
        card.appendChild(row);
      });
      w.appendChild(card);
    }
    var fab = el('button','fab','+');
    fab.onclick = function(){ addingExpense = {description:'', amount:'', category:'Misc'}; render(); };
    w.appendChild(fab);
    return w;
  }
  function renderExpenseSheet(){
    var ex = addingExpense;
    var bd = el('div','sheet-backdrop');
    bd.onclick = function(e){ if(e.target===bd){ addingExpense=null; render(); } };
    var sheet = el('div','sheet');
    sheet.appendChild(el('div','sheet-handle'));
    sheet.appendChild(el('h3','','Add expense'));
    var descF = el('div','field'); descF.appendChild(el('label','','What was it for'));
    var descI = el('input',''); descI.type='text'; descI.placeholder='e.g. Electricity bill'; descI.value=ex.description;
    descI.oninput=function(e){ex.description=e.target.value;}; descF.appendChild(descI); sheet.appendChild(descF);
    var amtF = el('div','field'); amtF.appendChild(el('label','','Amount (₹)'));
    var amtI = el('input',''); amtI.type='number'; amtI.inputMode='decimal'; amtI.placeholder='0'; amtI.value=ex.amount;
    amtI.oninput=function(e){ex.amount=e.target.value;}; amtF.appendChild(amtI); sheet.appendChild(amtF);
    var catF = el('div','field'); catF.appendChild(el('label','','Category'));
    var catS = document.createElement('select');
    EXPENSE_CATEGORIES.forEach(function(c){ var o=document.createElement('option'); o.value=c; o.textContent=c; if(c===ex.category) o.selected=true; catS.appendChild(o); });
    catS.onchange=function(e){ex.category=e.target.value;};
    catF.appendChild(catS); sheet.appendChild(catF);
    var save = el('button','btn-primary','Save expense');
    save.onclick = function(){
      if(!ex.description.trim() || !(Number(ex.amount)>0)) return;
      addExpense(ex); addingExpense=null; render();
    };
    sheet.appendChild(save);
    var cancel = el('button','btn-secondary','Cancel');
    cancel.onclick = function(){ addingExpense=null; render(); };
    sheet.appendChild(cancel);
    bd.appendChild(sheet);
    return bd;
  }

  /* ---- reports ---- */
  function renderReports(){
    var w = document.createElement('div');
    var subs = el('div','subtabs');
    [['sales','Sales'],['purchases','Purchases'],['stock','Stock'],['payments','Payments']].forEach(function(s){
      var b = el('button','subtab-btn'+(reportsSub===s[0]?' active':''), s[1]);
      b.onclick = function(id){ return function(){ reportsSub=id; render(); }; }(s[0]);
      subs.appendChild(b);
    });
    w.appendChild(subs);
    if(reportsSub!=='stock'){
      var rangeRow = el('div','segmented'); rangeRow.style.marginTop='10px';
      REPORT_RANGES.forEach(function(r){
        var b = el('button','seg-btn'+(reportsRange===r[0]?' active':''), r[1]);
        b.onclick = function(val){ return function(){
          reportsRange=val;
          if(val==='custom' && !customFrom && !customTo){
            var t=new Date(), f=new Date(); f.setDate(f.getDate()-6);
            customTo = t.toISOString().slice(0,10);
            customFrom = f.toISOString().slice(0,10);
          }
          render();
        }; }(r[0]);
        rangeRow.appendChild(b);
      });
      w.appendChild(rangeRow);
      if(reportsRange==='custom'){
        var dateRow = document.createElement('div'); dateRow.style.display='flex'; dateRow.style.gap='10px'; dateRow.style.marginTop='10px';
        var fF = el('div','field'); fF.style.flex='1'; fF.style.marginTop='0';
        fF.appendChild(el('label','','From'));
        var fI = document.createElement('input'); fI.type='date'; fI.value=customFrom||''; if(customTo) fI.max=customTo;
        fI.onchange = function(e){ customFrom = e.target.value; render(); };
        fF.appendChild(fI);
        var tF = el('div','field'); tF.style.flex='1'; tF.style.marginTop='0';
        tF.appendChild(el('label','','To'));
        var tI = document.createElement('input'); tI.type='date'; tI.value=customTo||''; if(customFrom) tI.min=customFrom;
        tI.onchange = function(e){ customTo = e.target.value; render(); };
        tF.appendChild(tI);
        dateRow.appendChild(fF); dateRow.appendChild(tF);
        w.appendChild(dateRow);
      }
    }
    if(reportsSub==='sales') w.appendChild(renderSalesReport());
    else if(reportsSub==='purchases') w.appendChild(renderPurchasesReport());
    else if(reportsSub==='stock') w.appendChild(renderStockReport());
    else w.appendChild(renderPaymentsReport());
    return w;
  }

  function renderSalesReport(){
    var w = document.createElement('div');
    var rangeSales = state.sales.filter(function(s){ return inRange(s.ts, reportsRange); });
    var rangeTotal = rangeSales.reduce(function(sum,s){return sum+s.total;},0);
    var rangeCost = rangeSales.reduce(function(sum,s){ return sum + s.items.reduce(function(a,it){return a+(it.costPrice||0)*it.qty;},0); },0);
    var profit = rangeTotal - rangeCost;

    var stats = el('div','stat-row stat-row3');
    var c1 = el('div','stat-card'); c1.appendChild(el('div','sv num', money(rangeTotal))); c1.appendChild(el('div','sl','Sales'));
    var c2 = el('div','stat-card'); c2.appendChild(el('div','sv num', String(rangeSales.length))); c2.appendChild(el('div','sl','Bills'));
    var c3 = el('div','stat-card'); c3.appendChild(el('div','sv num', money(profit))); c3.appendChild(el('div','sl','Profit (est.)'));
    stats.appendChild(c1); stats.appendChild(c2); stats.appendChild(c3);
    w.appendChild(stats);

    var chartDays;
    if(reportsRange==='custom'){ var cb=customBounds(); chartDays = Math.min(14, Math.max(1, Math.round((cb.to-cb.from)/86400000)+1)); }
    else chartDays = Math.min(rangeDays(reportsRange), 14);
    w.appendChild(el('div','section-label', 'Last ' + chartDays + ' days'));
    var days = [];
    for(var i=chartDays-1;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i); days.push(d); }
    var totals = days.map(function(d){
      var k = todayKey(d.getTime());
      return state.sales.filter(function(s){return todayKey(s.ts)===k;}).reduce(function(sum,s){return sum+s.total;},0);
    });
    var max = Math.max.apply(null, totals.concat([1]));
    var chart = el('div','bar-chart');
    days.forEach(function(d,i){
      var col = el('div','bar-col');
      var barWrap = document.createElement('div'); barWrap.style.width='100%'; barWrap.style.display='flex'; barWrap.style.justifyContent='center'; barWrap.style.flex='1'; barWrap.style.alignItems='flex-end';
      var bar = el('div','bar'); bar.style.height = Math.max(3, Math.round((totals[i]/max)*90)) + 'px';
      bar.title = money(totals[i]);
      barWrap.appendChild(bar);
      col.appendChild(barWrap);
      col.appendChild(el('div','bl', d.toLocaleDateString('en-IN',{weekday:'narrow'})));
      chart.appendChild(col);
    });
    w.appendChild(chart);

    w.appendChild(el('div','section-label','Transactions — ' + rangeLabel(reportsRange)));
    if(!rangeSales.length){ w.appendChild(el('div','empty','No sales in this period.')); }
    else{
      var card = el('div','card'); card.style.padding='2px 12px';
      rangeSales.slice().reverse().forEach(function(s){
        var row = el('div','sale-row');
        var l = document.createElement('div');
        var when = reportsRange==='1d' ? new Date(s.ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}) : new Date(s.ts).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
        l.appendChild(el('div','st', when + ' · ' + (s.paymentMethod||'Cash')));
        l.appendChild(el('div','sd', s.items.map(function(it){return it.name+' ×'+it.qty;}).join(', ') + (s.customerName?(' — '+s.customerName):'')));
        row.appendChild(l);
        var right = document.createElement('div'); right.style.textAlign='right'; right.style.display='flex'; right.style.flexDirection='column'; right.style.alignItems='flex-end'; right.style.gap='4px';
        right.appendChild(el('div','sv num', money(s.total)));
        var shareBtn = el('button','link-btn','Share');
        shareBtn.style.fontSize='11.5px'; shareBtn.style.padding='0';
        shareBtn.onclick = function(sale){ return function(){ sharePdfBill(sale); }; }(s);
        right.appendChild(shareBtn);
        row.appendChild(right);
        card.appendChild(row);
      });
      w.appendChild(card);
    }
    return w;
  }

  function renderPurchasesReport(){
    var w = document.createElement('div');
    var rangeP = state.purchases.filter(function(x){ return inRange(x.ts, reportsRange); });
    var total = rangeP.reduce(function(s,x){return s+x.total;},0);
    var stats = el('div','stat-row');
    var c1=el('div','stat-card'); c1.appendChild(el('div','sv num',money(total))); c1.appendChild(el('div','sl','Spent'));
    var c2=el('div','stat-card'); c2.appendChild(el('div','sv num',String(rangeP.length))); c2.appendChild(el('div','sl','Stock-ins'));
    stats.appendChild(c1); stats.appendChild(c2); w.appendChild(stats);
    w.appendChild(el('div','section-label','Stock received — ' + rangeLabel(reportsRange)));
    if(!rangeP.length){ w.appendChild(el('div','empty','No stock recorded in this period.')); }
    else{
      var card=el('div','card'); card.style.padding='2px 12px';
      rangeP.slice().reverse().forEach(function(x){
        var row=el('div','sale-row');
        var l=document.createElement('div');
        var when = reportsRange==='1d' ? new Date(x.ts).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}) : new Date(x.ts).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
        l.appendChild(el('div','st', when));
        l.appendChild(el('div','sd', x.productName + ' ×' + x.qty + ' @ ' + money(x.costPrice)));
        row.appendChild(l);
        row.appendChild(el('div','sv num', money(x.total)));
        card.appendChild(row);
      });
      w.appendChild(card);
    }
    return w;
  }

  function renderStockReport(){
    var w = document.createElement('div');
    var totalUnits = state.products.reduce(function(s,p){return s+(p.stock||0);},0);
    var costValue = state.products.reduce(function(s,p){return s+(p.stock||0)*(p.costPrice||0);},0);
    var saleValue = state.products.reduce(function(s,p){return s+(p.stock||0)*(p.price||0);},0);
    var stats = el('div','stat-row stat-row3');
    var c1=el('div','stat-card'); c1.appendChild(el('div','sv num',String(totalUnits))); c1.appendChild(el('div','sl','Units in stock'));
    var c2=el('div','stat-card'); c2.appendChild(el('div','sv num',money(costValue))); c2.appendChild(el('div','sl','Value at cost'));
    var c3=el('div','stat-card'); c3.appendChild(el('div','sv num',money(saleValue))); c3.appendChild(el('div','sl','Value at sale price'));
    stats.appendChild(c1); stats.appendChild(c2); stats.appendChild(c3); w.appendChild(stats);

    var lowT = state.lowStockThreshold||5;
    var lowCount = state.products.filter(function(p){return p.stock<=lowT;}).length;

    w.appendChild(el('div','section-label', 'Product-wise stock' + (lowCount ? ' — ' + lowCount + ' low/out' : '')));
    if(!state.products.length){ w.appendChild(el('div','empty','No products yet. Add some from the Stock tab.')); }
    else{
      var all = state.products.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
      var card=el('div','card'); card.style.padding='2px 12px';
      all.forEach(function(p){
        var row=el('div','inv-row');
        var mid=document.createElement('div'); mid.style.flex='1';
        mid.appendChild(el('div','iname',p.name));
        row.appendChild(mid);
        var cls = p.stock<=0?'out':(p.stock<=lowT?'low':'ok');
        var label = p.stock<=0 ? 'Out' : (p.stock + ' qty');
        row.appendChild(el('span','stock-pill '+cls, label));
        card.appendChild(row);
      });
      w.appendChild(card);
    }
    return w;
  }

  function renderPaymentsReport(){
    var w = document.createElement('div');
    var rangeSales = state.sales.filter(function(s){ return inRange(s.ts, reportsRange); });
    var byMethod = {};
    PAYMENT_METHODS.forEach(function(m){byMethod[m]=0;});
    rangeSales.forEach(function(s){ var m = s.paymentMethod||'Cash'; if(byMethod[m]===undefined) byMethod[m]=0; byMethod[m]+=s.total; });
    var total = rangeSales.reduce(function(s,x){return s+x.total;},0);
    var max = Math.max.apply(null, Object.keys(byMethod).map(function(k){return byMethod[k];}).concat([1]));

    w.appendChild(el('div','section-label','Takings by payment method — ' + rangeLabel(reportsRange)));
    var card = el('div','card'); card.style.padding='14px';
    Object.keys(byMethod).forEach(function(m){
      var row = document.createElement('div'); row.style.marginBottom='12px';
      var top = document.createElement('div'); top.style.display='flex'; top.style.justifyContent='space-between'; top.style.fontSize='13px'; top.style.marginBottom='5px';
      top.appendChild(el('span','',m));
      top.appendChild(el('span','num', money(byMethod[m])));
      row.appendChild(top);
      var track = document.createElement('div'); track.style.height='8px'; track.style.borderRadius='4px'; track.style.background='var(--surface-2)'; track.style.overflow='hidden';
      var fill = document.createElement('div'); fill.style.height='100%'; fill.style.borderRadius='4px'; fill.style.background='var(--accent)'; fill.style.width = Math.round((byMethod[m]/max)*100) + '%';
      track.appendChild(fill); row.appendChild(track);
      card.appendChild(row);
    });
    w.appendChild(card);

    var stats = el('div','stat-row');
    var c1=el('div','stat-card'); c1.appendChild(el('div','sv num',money(total))); c1.appendChild(el('div','sl','Total collected'));
    var c2=el('div','stat-card'); c2.appendChild(el('div','sv num',String(rangeSales.length))); c2.appendChild(el('div','sl','Transactions'));
    stats.appendChild(c1); stats.appendChild(c2);
    w.appendChild(stats);
    return w;
  }

  /* ---- settings ---- */
  function renderSettings(){
    var w = document.createElement('div');
    w.appendChild(el('div','section-label','Sync'));
    var cardS = el('div','card'); cardS.style.padding='14px'; cardS.style.fontSize='13px'; cardS.style.color='var(--ink-muted)';
    cardS.textContent = configured
      ? (syncStatus==='ok' ? 'Connected to your Google Sheet. Changes save automatically.' : syncStatus==='busy' ? 'Syncing…' : 'Could not reach the backend — check your internet connection or the Apps Script deployment.')
      : 'Backend not configured yet — open index.html and set SCRIPT_URL. Until then, data only stays on this device and resets on reload.';
    w.appendChild(cardS);

    w.appendChild(el('div','section-label','Store'));
    var card1 = el('div','card'); card1.style.padding='2px 14px';
    var r1 = el('div','settings-row');
    var l1 = document.createElement('div'); l1.appendChild(el('div','sl2','Store name')); l1.appendChild(el('div','sd2', state.storeName||'Vedlakshana Store'));
    r1.appendChild(l1);
    var e1 = el('button','link-btn','Edit');
    e1.onclick = function(){ var name = prompt('Store name', state.storeName||'Vedlakshana Store'); if(name!==null) setStoreName(name.trim()); };
    r1.appendChild(e1); card1.appendChild(r1);
    w.appendChild(card1);

    w.appendChild(el('div','section-label','Security'));
    var card2 = el('div','card'); card2.style.padding='2px 14px';
    var r2 = el('div','settings-row');
    var l2 = document.createElement('div'); l2.appendChild(el('div','sl2','PIN')); l2.appendChild(el('div','sd2','4-digit unlock code'));
    r2.appendChild(l2);
    var e2 = el('button','link-btn','Change');
    e2.onclick = function(){
      var p = prompt('New 4-digit PIN');
      if(p && /^\d{4}$/.test(p)) setPin(p);
      else if(p) alert('PIN must be exactly 4 digits');
    };
    r2.appendChild(e2); card2.appendChild(r2);
    var r2b = el('div','settings-row');
    l2 = document.createElement('div'); l2.appendChild(el('div','sl2','Lock app')); l2.appendChild(el('div','sd2','Return to PIN screen'));
    r2b.appendChild(l2);
    var e2b = el('button','link-btn','Lock now');
    e2b.onclick = function(){ unlocked=false; bioAutoTried=false; tab='home'; render(); };
    r2b.appendChild(e2b); card2.appendChild(r2b);
    var r2c = el('div','settings-row');
    var l2c = document.createElement('div'); l2c.appendChild(el('div','sl2','Fingerprint unlock'));
    var credId2 = bioCredId();
    l2c.appendChild(el('div','sd2', !bioPlatformAvailable ? 'Not available on this device/browser' : credId2 ? 'Enabled on this device' : 'Skip the PIN using your phone\'s fingerprint/face unlock'));
    r2c.appendChild(l2c);
    if(bioPlatformAvailable){
      var e2c = el('button','link-btn', credId2 ? 'Remove' : 'Set up');
      e2c.onclick = credId2 ? removeFingerprint : setupFingerprint;
      r2c.appendChild(e2c);
    }
    card2.appendChild(r2c);
    w.appendChild(card2);

    w.appendChild(el('div','section-label','Stock alerts'));
    var card3 = el('div','card'); card3.style.padding='2px 14px';
    var r3 = el('div','settings-row');
    var l3 = document.createElement('div'); l3.appendChild(el('div','sl2','Low-stock threshold')); l3.appendChild(el('div','sd2','Warn when stock falls to or below this'));
    r3.appendChild(l3);
    var e3 = el('button','link-btn', String(state.lowStockThreshold||5) + ' ⚙');
    e3.onclick = function(){ var n = prompt('Low stock threshold', String(state.lowStockThreshold||5)); if(n!==null && !isNaN(n)) setThreshold(n); };
    r3.appendChild(e3); card3.appendChild(r3);
    w.appendChild(card3);

    return w;
  }

  /* ---------- init ---------- */
  loadState();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).catch(function(){});
    });
  }

})();
</script>
