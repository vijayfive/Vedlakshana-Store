# Nginx server block for store-api.sarwora.com
# Place as its own file, e.g. /etc/nginx/sites-available/store-api.sarwora.com,
# then: sudo ln -s /etc/nginx/sites-available/store-api.sarwora.com /etc/nginx/sites-enabled/
# (adjust to match whatever pattern your existing server blocks use)
#
# Unlike the PostgREST version, CORS is NOT handled here — the FastAPI app
# itself handles it (see ALLOWED_ORIGIN in .env), so this config is simpler.

server {
    listen 80;
    server_name store-api.sarwora.com;

    # Certbot rewrites this to add HTTPS + redirect automatically:
    #   sudo certbot --nginx -d store-api.sarwora.com

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# DNS: add an A record for "store-api" pointing at your VPS's IP, same as
# your other subdomains. Give it a few minutes before running certbot.
